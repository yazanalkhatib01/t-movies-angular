<div class="search-page">
  <div class="search-page__header">
    <button class="detail__back" (click)="goBack()">
      <span class="material-symbols-outlined">arrow_back</span>
      Back
    </button>

    <div class="search-page__input-wrapper">
      <span class="material-symbols-outlined">search</span>
      <input
        type="text"
        class="search-page__input"
        placeholder="Search movies, series..."
        [value]="query()"
        (input)="onInput($event)"
        autofocus
      />
    </div>
  </div>

  @if (loading()) {
    <div class="search-page__loading">
      <span class="material-symbols-outlined search-page__spin">progress_activity</span>
    </div>
  }

  @if (isEmpty()) {
    <div class="search-page__empty">
      <span class="material-symbols-outlined">search_off</span>
      <p>No results found for "{{ query() }}"</p>
    </div>
  }

  @if (results().length > 0) {
    <div class="container">
      <p class="search-page__count">{{ results().length }} results for "{{ query() }}"</p>
      <div class="search-page__grid">
        @for (movie of results(); track movie.id) {
          <app-movie-card [movie]="movie" />
        }
      </div>
    </div>
  }
</div>
